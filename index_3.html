<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="社團法人國際醫療翻譯協會 電子收據產生器">
<title>電子收據產生器 — 國際醫療翻譯協會 IMTIA</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: sans-serif; background: #eaeae2; min-height: 100vh; }

/* ── 工具列 ── */
#toolbar {
  background: #16213e; color: white;
  padding: 12px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
#toolbar h1 { font-size: 15px; font-weight: bold; }
.btn { padding: 6px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; border: none; }
.btn-upload { background: #e74c3c; color: white; display: inline-block; }
.btn-print { background: #1abc9c; color: white; display: none; }
#info { font-size: 12px; opacity: .75; }

/* ── 資料來源切換 tabs ── */
#source-tabs {
  background: #0d1b2a; color: #aac;
  padding: 0 24px; display: flex; align-items: stretch; gap: 0;
  border-bottom: 2px solid #1abc9c;
}
.tab {
  padding: 8px 20px; cursor: pointer; font-size: 13px;
  border-bottom: 3px solid transparent; margin-bottom: -2px;
  transition: all .2s; color: #778;
}
.tab.active { color: white; border-bottom-color: #1abc9c; font-weight: bold; }
.tab:hover { color: #ccd; }

/* ── 上傳區 / Google Sheets 區 ── */
#panel-upload, #panel-gsheet {
  background: #0f3460; color: #aac;
  padding: 10px 24px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 13px;
}
#panel-gsheet { display: none; flex-direction: column; align-items: flex-start; gap: 8px; }

#gsheet-input-row { display: flex; gap: 10px; align-items: center; width: 100%; flex-wrap: wrap; }
#gsheet-url {
  flex: 1; min-width: 280px; padding: 6px 10px; border-radius: 6px;
  border: 1px solid #2980b9; background: #1a2a4a; color: white; font-size: 12px;
}
#gsheet-url::placeholder { color: #556; }
.btn-gload { background: #2980b9; color: white; }
#gsheet-status { font-size: 11px; opacity: .75; }
#gsheet-hint {
  font-size: 11px; color: #667; line-height: 1.6;
  background: rgba(0,0,0,.2); padding: 6px 10px; border-radius: 4px; width: 100%;
}

/* ── 收據選擇列 ── */
#select-row {
  background: #122040; color: #aac;
  padding: 6px 24px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 12px;
}
#receipt-select {
  padding: 6px 10px; border-radius: 6px; font-size: 13px;
  min-width: 240px; border: none; display: none;
}

#preview { padding: 20px 24px; }
#empty-msg { text-align: center; color: #888; margin-top: 60px; font-size: 14px; line-height: 2; }

/* ── 收據樣式 ── */
.receipt {
  width: 190mm;
  border: 1.5px solid #333;
  font-family: 'Noto Serif TC', '標楷體', serif;
  font-size: 9pt;
  background: white;
  margin-bottom: 6mm;
}
.receipt-header { display: flex; align-items: center; border-bottom: 1px solid #333; padding: 3px 8px; }
.receipt-title { flex: 1; text-align: center; font-weight: bold; font-size: 11pt; letter-spacing: 2px; }
.receipt-no { font-size: 8.5pt; white-space: nowrap; }
.receipt-payer { display: flex; align-items: center; border-bottom: 1px solid #333; padding: 3px 8px; gap: 10px; }
.receipt-body { display: flex; }
.receipt-main { flex: 1; }

.fee-table { width: 100%; border-collapse: collapse; }
.fee-table tr { border-bottom: 0.5px solid #ddd; }
.fee-pfx { width: 20px; padding: 2px 4px; text-align: center; color: #666; font-size: 8pt; }
.fee-chk { width: 16px; text-align: center; }
.fee-name { padding: 2px 6px; }
.fee-amount { width: 72px; text-align: right; padding: 2px 4px; }
.fee-unit { width: 14px; color: #666; }
.fee-checked { font-weight: bold; color: #c0392b; }

.receipt-note { padding: 2px 8px; border-top: 0.5px solid #ccc; font-size: 8.5pt; }
.receipt-total { padding: 5px 8px; border-top: 1px solid #333; display: flex; align-items: baseline; gap: 6px; }
.total-amount { font-size: 15pt; font-weight: bold; color: #c0392b; }
.total-chinese { font-size: 12pt; }
.receipt-case { padding: 2px 8px; border-top: 0.5px solid #ccc; font-size: 8pt; color: #555; }

.receipt-stamps {
  display: flex;
  border-top: 0.5px solid #ccc;
  padding: 6px 0;
  align-items: center;
  min-height: 125px;
}

/* 每個印章格子：名稱左側垂直，印章右側，水平排列 */
.stamp-cell {
  flex: 1;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 4px;
}

/* 職稱文字（垂直排）*/
.stamp-role {
  font-size: 8pt;
  color: #444;
  writing-mode: vertical-rl;
  text-orientation: upright;
  letter-spacing: 3px;
  line-height: 1.3;
  flex-shrink: 0;
}

/* 一般印章 68×68px */
.stamp-img {
  width: 68px;
  height: 68px;
  object-fit: contain;
}

/* 單位章：橢圓形，高度 = 理事長 68px × 1.5 = 102px，寬 = 102 × 1.65 = 168px */
.stamp-img-unit {
  width: 168px;
  height: 102px;
  object-fit: contain;
}

.receipt-date {
  width: 28px; border-left: 1px solid #333;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 8.5pt; line-height: 1.9; padding: 4px 2px;
}
.receipt-copyname { text-align: right; border-top: 1px solid #333; padding: 2px 8px; font-size: 8.5pt; color: #888; }

/* ── 列印：三聯各一頁 ── */
@media print {
  #toolbar, #source-tabs, #panel-upload, #panel-gsheet, #select-row { display: none !important; }
  body { background: white; }
  #preview { padding: 0; margin: 0; }

  /* 強制每聯各佔一整頁 */
  .page-wrapper {
    display: block;
    page-break-inside: avoid;
    break-inside: avoid;
  }
  .receipt {
    width: 100%;
    margin: 0;
    border: 1.5px solid #333;
    page-break-inside: avoid;
    break-inside: avoid;
  }

  /* 包住三張收據的容器 */
  #preview {
    display: block;
  }
}
</style>
</head>
<body>

<!-- 工具列 -->
<div id="toolbar">
  
  <span id="info"></span>
  <button class="btn btn-print" id="btn-print" onclick="window.print()">🖨️ 列印 / 存 PDF</button>
  <button class="btn" onclick="resetApp()"
    style="background:#2c3e50;color:white;">🏠 回首頁</button>
  <button class="btn" onclick="window.scrollTo({top:0,behavior:'smooth'})"
    style="background:#555;color:white;margin-left:auto;">⬆ 回頂端</button>
</div>

<!-- 資料來源 Tabs -->
<div id="source-tabs">
  <div class="tab active" onclick="switchTab('upload')">📂 上傳 Excel</div>
  <div class="tab" onclick="switchTab('gsheet')">🔗 Google Sheets 連結</div>
</div>

<!-- Panel：上傳 Excel -->
<div id="panel-upload">
  <label class="btn btn-upload">
    📂 選擇 Excel 檔案
    <input type="file" id="excel-input" accept=".xlsx,.xls" style="display:none">
  </label>
  <span style="font-size:11px;opacity:.6;">支援 .xlsx / .xls，自動尋找收據工作表</span>
</div>

<!-- Panel：Google Sheets -->
<div id="panel-gsheet">
  <div id="gsheet-input-row">
    <input id="gsheet-url" type="text" placeholder="貼上 Google Sheets 分享連結，例如：https://docs.google.com/spreadsheets/d/xxxxx/edit?usp=sharing">
    <button class="btn btn-gload" onclick="loadGSheet()">🔄 載入資料</button>
  </div>
  <div id="gsheet-status"></div>
  <div id="gsheet-hint">
    ⚠️ 貼上 Google Sheets 分享連結，需設定為「<b style="color:#f39c12">知道連結的人可以檢視</b>」<br>
    設定方式：試算表右上角 → 共用 → 一般存取 → 選「知道連結的人」→ 檢視者
  </div>
</div>

<!-- 收據選擇列 -->
<div id="select-row">
  <span>選擇收據：</span>
  <select id="receipt-select"><option value="">— 請選擇收據編號 —</option></select>
  <span id="select-hint" style="opacity:.6;font-size:11px;"></span>
</div>

<!-- 預覽區 -->
<div id="preview">
  <div id="empty-msg">
    請選擇資料來源：<br>
    <b>📂 上傳 Excel</b> — 從本機選擇 .xlsx 檔案<br>
    <b>🔗 Google Sheets</b> — 貼上試算表分享連結自動讀取
  </div>
</div>

<script>

// ── Sheet 自動對應邏輯 ──
// 優先順序：① 收據總表 → ② 含當年民國年數字 → ③ 含任意年份數字 → ④ 第一個sheet
function pickSheet(sheetNames) {
  const rocYear = new Date().getFullYear() - 1911;
  return sheetNames.find(n => n === "收據總表")
      || sheetNames.find(n => n.includes(String(rocYear)))
      || sheetNames.find(n => /\d{3}/.test(n))
      || sheetNames[0];
}

// ── Tab 切換 ──
function switchTab(tab) {

    t.classList.toggle('active', (i===0&&tab==='upload')||(i===1&&tab==='gsheet'));
  });

// ── 今日民國日期 ──
function getTodayROC() {
  const now = new Date();
  return (now.getFullYear()-1911) + "年" + (now.getMonth()+1) + "月" + now.getDate() + "日";
}

// ── 數字轉中文 ──
function toChinese(n) {
  if (!n || n===0) return "零元整";
  const d=["零","壹","貳","參","肆","伍","陸","柒","捌","玖"],u=["","拾","佰","仟"];
  let w=Math.floor(n/10000),r=n%10000,s="";
  if(w>0){String(w).padStart(4,"0").split("").forEach((c,i)=>{if(c!=="0")s+=d[+c]+u[3-i];else if(s&&s.slice(-1)!=="零")s+="零";});s+="萬";}
  if(r>0){String(r).padStart(4,"0").split("").forEach((c,i)=>{if(c!=="0")s+=d[+c]+u[3-i];else if(s&&s.slice(-1)!=="零")s+="零";});}
  return s.replace(/零+/g,"零").replace(/零$/,"")+"元整";
}

// ── 產生收據 HTML ──
function buildReceipt(data, label, isLast=false) {
  const fees = FEE_KEYS.map(k=>({key:k, val:Number(data[k])||0}));
  const total = fees.reduce((a,f)=>a+f.val, 0);
  const dateStr = (data["開出日期"]&&String(data["開出日期"]).trim())
    ? String(data["開出日期"]).trim() : getTodayROC();
  const dateChars = ("中華民國"+dateStr+"︵開出︶").split("");

  const feeRows = fees.map((f,i)=>`
    <tr>
      <td class="fee-pfx">${FEE_PFX[i]}</td>
      <td class="fee-chk">${f.val>0?"■":"□"}</td>
      <td class="fee-name">${f.key}</td>
      <td class="fee-amount ${f.val>0?"fee-checked":""}">${f.val>0?f.val.toLocaleString():""}</td>
      <td class="fee-unit">${f.val>0?"元":""}</td>
    </tr>`).join("");

  return `
  <div class="page-wrapper" style="${isLast ? '' : 'page-break-after:always;break-after:page;'}">
  <div class="receipt">
    <div class="receipt-header">
      <div class="receipt-title">社團法人國際醫療翻譯協會　各項費用收據</div>
      <div class="receipt-no">No.&ensp;<b>${data["收據編號"]||""}</b></div>
    </div>
    <div class="receipt-payer">
      <span style="white-space:nowrap">繳款人姓名</span>
      <b style="flex:1;font-size:10.5pt">${data["姓名"]||""}</b>
      <span style="white-space:nowrap">繳款人 國民身分證統一編號</span>
      <b>${data["統編/身分證字號"]||""}</b>
    </div>
    <div class="receipt-body">
      <div class="receipt-main">
        <table class="fee-table"><tbody>${feeRows}</tbody></table>
        <div class="receipt-note">備註&emsp;劃撥日結單&emsp;號&emsp;&emsp;&emsp;&emsp;&emsp;匯(支)票：</div>
        <div class="receipt-total">
          <span>總計新台幣</span>
          <span class="total-amount">${total.toLocaleString()}</span>
          <span>元</span>
          <span class="total-chinese">&emsp;${toChinese(total)}</span>
        </div>
        <div class="receipt-case">立案字號：台內團字第1090281089號&emsp;&emsp;統一編號：49723480</div>
        <div class="receipt-stamps">
          <div class="stamp-cell"><span class="stamp-role">單位章</span><img class="stamp-img-unit" src="${SU}" alt="單位章"></div>
          <div class="stamp-cell"><span class="stamp-role">理事長</span><img class="stamp-img" src="${SP}" alt="理事長"></div>
          <div class="stamp-cell"><span class="stamp-role">秘書長</span><img class="stamp-img" src="${SE}" alt="秘書長"></div>
          <div class="stamp-cell"><span class="stamp-role">經辦人</span><img class="stamp-img" src="${SE}" alt="經辦人"></div>
        </div>
      </div>
      <div class="receipt-date">${dateChars.map(c=>`<span>${c}</span>`).join("")}</div>
    </div>
    <div class="receipt-copyname">${label}</div>
  </div>
  </div>`;
}

let allRows = [];
function loadRows(rows, sourceName) {
  allRows = rows.filter(r => r["收據編號"] && String(r["收據編號"]).trim());
  document.getElementById("info").textContent = `✓ ${sourceName}（${allRows.length} 筆收據）`;
  const sel = document.getElementById("receipt-select");
  sel.innerHTML = '<option value="">— 請選擇收據編號 —</option>';
  allRows.forEach((r,i) => {
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = `${r["收據編號"]} — ${r["姓名"]}`;
    sel.appendChild(opt);
  });
  sel.style.display = "block";
  document.getElementById("select-hint").textContent = "選擇後自動顯示三聯預覽";
  const em = document.getElementById("empty-msg");
  if(em) em.remove();
  document.getElementById("preview").innerHTML = "";
  document.getElementById("btn-print").style.display = "none";
}

document.getElementById("excel-input").addEventListener("change", function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    const wb = XLSX.read(evt.target.result, {type:"binary"});
    const shName = pickSheet(wb.SheetNames);
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[shName], {defval:""});
    loadRows(rows, file.name);
  };
  reader.readAsBinaryString(file);
});

// ── 方法②：Google Sheets ──
// 偵測 URL 類型並回傳 {type, id}
function detectUrlType(url) {
  // Google Sheets: /spreadsheets/d/ID
  let m = url.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);
  if (m) return { type: "sheets", id: m[1] };

  // Google Drive 檔案: /file/d/ID
  m = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
  if (m) return { type: "drive", id: m[1] };

  // Google Drive open: id=ID
  m = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if (m) return { type: "drive", id: m[1] };

  return null;
}

// 向下相容舊的 extractSheetId
function extractSheetId(url) {
  const r = detectUrlType(url);
  return r ? r.id : null;
}

function loadGSheet() {
  const url = document.getElementById("gsheet-url").value.trim();
  const status = document.getElementById("gsheet-status");
  if (!url) { status.textContent = "⚠️ 請先貼上連結"; return; }

  const urlInfo = detectUrlType(url);
  if (!urlInfo) {
    status.textContent = "❌ 連結格式不正確";
    return;
  }

  status.textContent = "⏳ 載入中...";
  status.style.color = "#aac";

  const id = urlInfo.id;
  const rocYear = new Date().getFullYear() - 1911;

  // GitHub Pages 用 https:// 開啟，fetch 不受 CORS 限制
  // 直接用 gviz CSV API（最可靠）
  const sheetNames = [
    "收據總表",
    String(rocYear) + "年",
    String(rocYear),
    "工作表1", "工作表2",
    "Sheet1", "Sheet2"
  ];

  // 從 URL 取得 gid
  const gidMatch = url.match(/[?&#]gid=(\d+)/);
  const gid = gidMatch ? gidMatch[1] : null;

  // 建立所有要嘗試的 URL 清單
  const urlsToTry = [];

  // 優先：用 gid（最準確）
  if (gid) {
    urlsToTry.push({
      url: `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&gid=${gid}`,
      label: `gid=${gid}`
    });
  }

  // 接著試各個 sheet 名稱
  sheetNames.forEach(name => {
    urlsToTry.push({
      url: `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}`,
      label: name
    });
  });

  // 最後試 export CSV（第一個 sheet）
  urlsToTry.push({
    url: `https://docs.google.com/spreadsheets/d/${id}/export?format=csv`,
    label: "第一個工作表"
  });

  // 依序嘗試
  async function tryUrls(index) {
    if (index >= urlsToTry.length) {
      const tried = urlsToTry.map(u => u.label).join("、");
      status.textContent = `❌ 找不到含「收據編號」的資料（嘗試了：${tried}）`;
      status.style.color = "#e74c3c";
      return;
    }

    const { url: fetchUrl, label } = urlsToTry[index];
    status.textContent = `⏳ 嘗試工作表「${label}」...`;

    try {
      const resp = await fetch(fetchUrl);
      if (!resp.ok) { tryUrls(index + 1); return; }
      const text = await resp.text();

      // 檢查是否是 HTML 錯誤頁
      if (!text || text.trim().startsWith("<") || text.length < 10) {
        tryUrls(index + 1); return;
      }

      // 用 XLSX 解析 CSV
      const wb = XLSX.read(text, { type: "string" });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { defval: "" });
      const valid = rows.filter(r => r["收據編號"] && String(r["收據編號"]).trim());

      if (valid.length === 0) { tryUrls(index + 1); return; }

      loadRows(valid, `Google Sheets（${label}）`);
      status.textContent = `✓ 成功載入「${label}」，共 ${valid.length} 筆`;
      status.style.color = "#2ecc71";

    } catch(e) {
      tryUrls(index + 1);
    }
  }

  tryUrls(0);
}

document.getElementById("gsheet-url").addEventListener("keydown", function(e) {
  if (e.key === "Enter") loadGSheet();

    </div>`;

  // 清空輸入
  document.getElementById("excel-input").value = "";
  document.getElementById("gsheet-url").value = "";
  document.getElementById("gsheet-status").textContent = "";

  // 切回「上傳 Excel」tab
  switchTab("upload");
}

// ── 選擇收據 ──
document.getElementById("receipt-select").addEventListener("change", function() {
  const idx = this.value;
  const preview = document.getElementById("preview");
  const btnPrint = document.getElementById("btn-print");
  if (idx === "") {
    preview.innerHTML = "";
    btnPrint.style.display = "none";
    return;
  }
  const data = allRows[parseInt(idx)];
  const copies = ["1 收執聯", "2 會計聯", "3 存根聯"];
  preview.innerHTML = copies.map((lbl, i) => {
    const isLast = i === copies.length - 1;
    return buildReceipt(data, lbl, isLast);
  }).join("");
  btnPrint.style.display = "inline-block";
  document.getElementById("select-hint").textContent = `已選：${data["收據編號"]} — ${data["姓名"]}`;
});
</script>
